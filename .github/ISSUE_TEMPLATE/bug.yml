name: Bug report
description: Report an incorrect or failed synchronization
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and logs
      description: Remove tokens and other secrets before posting.
    validations:
      required: true
