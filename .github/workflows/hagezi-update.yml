name: Check HaGeZi pins

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Prepare safe update
        id: update
        run: |
          set -euo pipefail
          python scripts/check_hagezi_update.py --config config.toml --update | tee hagezi-update.txt
          if git diff --quiet -- config.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/validate_config.py config.toml
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open reviewable update PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="automation/hagezi-pin-update"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update HaGeZi commit pins"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "chore: update HaGeZi commit pins" \
              --body "Automated pin update. CI must pass before merge." \
              --base "$BASE" --head "$branch" || {
              echo "::error::Could not open the PR. Enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
              exit 1
            }
          fi
          # PRs opened with GITHUB_TOKEN don't trigger CI, so start it by hand
          gh workflow run ci.yml --ref "$branch"
