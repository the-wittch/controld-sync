name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Compile, lint, and test
        run: |
          python -m py_compile src/controld_sync/*.py scripts/*.py
          ruff check .
          ruff format --check .
          pyright
          python -m unittest discover -s tests -v
      - name: Validate configuration
        run: python scripts/validate_config.py config.toml

  test:
    if: always()
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Report matrix result
        run: test "${{ needs.quality.result }}" = "success"
