name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.x"
      - name: Compile and test
        run: |
          python -m py_compile controld_sync.py controld_sync/*.py scripts/*.py
          python -m unittest discover -v
      - name: Validate configuration
        run: python scripts/validate_config.py config.toml
