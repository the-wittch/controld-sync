name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Compile, lint, and test
        run: |
          python -m py_compile src/controld_sync/*.py scripts/*.py
          ruff check .
          ruff format --check .
          pyright
          python -m unittest discover -s tests -v
      - name: Validate configuration
        if: matrix.python-version == '3.11'
        run: python scripts/validate_config.py config.toml

  test:
    if: always()
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Report matrix result
        run: test "${{ needs.quality.result }}" = "success"
