name: Restricted Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Merge Actions patch/minor updates after CI
        if: >-
          steps.meta.outputs.package-ecosystem == 'github_actions' &&
          contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.meta.outputs.update-type)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # a red check here would block the PR, so refusals exit 0
          refuse() { echo "$1"; exit 0; }

          ci_ok=false
          for _ in $(seq 1 40); do
            mapfile -t runs < <(
              gh run list --repo "$REPO" --workflow ci.yml --commit "$HEAD_SHA" \
                --json status,conclusion --jq '.[] | "\(.status)=\(.conclusion // "")"'
            )
            if printf '%s\n' "${runs[@]}" | grep -qx 'completed=success'; then
              ci_ok=true
              break
            fi
            if printf '%s\n' "${runs[@]}" | grep -Eq 'completed=(failure|cancelled|timed_out)'; then
              refuse "CI failed for this head; refusing auto-merge."
            fi
            sleep 30
          done
          [ "$ci_ok" = true ] || refuse "CI did not succeed in time; refusing auto-merge."

          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -Evq '^\.github/workflows/[^/]+\.ya?ml$'; then
            refuse "Not an Actions-only update; refusing auto-merge."
          fi
          if gh pr diff "$PR" --repo "$REPO" | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---) ' \
            | grep -Evq '^[+-][[:space:]-]*uses: '; then
            refuse "The diff changes more than action pins; refusing auto-merge."
          fi

          if ! out="$(gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch 2>&1)"; then
            refuse "gh pr merge did not queue: $out"
          fi
          echo "$out"
