name: Restricted Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Approve only safe Actions patch/minor updates after CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          # Wait for CI on this head (Dependabot PRs often open before checks finish).
          ci_ok=false
          for _ in $(seq 1 40); do
            mapfile -t runs < <(
              gh run list --repo "$REPO" --workflow ci.yml --commit "$head_sha" \
                --json status,conclusion --jq '.[] | "\(.status)=\(.conclusion // "")"'
            )
            if [ "${#runs[@]}" -gt 0 ]; then
              if printf '%s\n' "${runs[@]}" | grep -qx 'completed=success'; then
                ci_ok=true
                break
              fi
              if printf '%s\n' "${runs[@]}" | grep -E 'completed=(failure|cancelled|timed_out)' >/dev/null; then
                echo "CI failed for this head; refusing auto-merge."
                exit 0
              fi
            fi
            sleep 30
          done
          if [ "$ci_ok" != true ]; then
            echo "CI did not succeed in time; refusing auto-merge."
            exit 0
          fi

          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          test -n "$files"
          if printf '%s\n' "$files" | grep -Evq '^\.github/workflows/[^/]+\.ya?ml$'; then
            echo "Not an Actions-only update; refusing auto-merge."
            exit 0
          fi
          diff="$(gh pr diff "$PR" --repo "$REPO")"
          if printf '%s' "$diff" | grep -Eq '(^|[+-])(permissions:|[[:space:]]+(contents|pull-requests|security-events):[[:space:]]*(write|none))|(^|[+-]).*(config\.toml|controld_sync/|scripts/)'; then
            echo "Permission or source/config change detected; refusing auto-merge."
            exit 0
          fi
          title="$(gh pr view "$PR" --repo "$REPO" --json title --jq .title)"
          if ! printf '%s' "$title" | grep -Eiq 'bump .* from v?[0-9]+\.[0-9]+(\.[0-9]+)? to v?[0-9]+\.[0-9]+(\.[0-9]+)?'; then
            echo "Could not prove this is a patch/minor version update."
            exit 0
          fi
          if printf '%s' "$title" | grep -Eq 'from v?([0-9]+)\.([0-9]+).* to v?([0-9]+)\.([0-9]+)'; then
            read -r old_major old_minor new_major new_minor < <(
              printf '%s' "$title" | sed -E 's/.*from v?([0-9]+)\.([0-9]+).* to v?([0-9]+)\.([0-9]+).*/\1 \2 \3 \4/'
            )
            if [ "$old_major" != "$new_major" ] || [ "$new_minor" -lt "$old_minor" ]; then
              echo "Major or downgrade update; refusing auto-merge."
              exit 0
            fi
          fi
          # Squash-merge directly once CI passed. --auto requires branch-required
          # checks that this repo does not expose to `gh pr checks --required`.
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
