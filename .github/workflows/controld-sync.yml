name: Sync Control D folders

on:
  schedule:
    # Every Sunday at 03:00 UTC.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controld-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CONTROLD_API_TOKEN: ${{ secrets.CONTROLD_API_TOKEN }}
    steps:
      - name: Check out source lists
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.x"

      - name: Run Control D sync
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONTROLD_API_TOKEN" || {
            echo "::error::Add CONTROLD_API_TOKEN as a repository secret."
            exit 1
          }
          test -f config.toml || {
            echo "::error::Create config.toml from config.toml.example."
            exit 1
          }
          python3 controld_sync.py --config config.toml --apply | tee sync-summary.txt

      - name: Publish sync summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Control D sync"
            echo
            if test -f sync-summary.txt; then
              echo '```text'
              cat sync-summary.txt
              echo '```'
            else
              echo "The sync command did not produce a summary."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
