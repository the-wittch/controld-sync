name: Configuration validation

on:
  push:
    paths: ["config.toml", "scripts/validate_config.py", ".github/workflows/config-validation.yml"]
  pull_request:
    paths: ["config.toml", "scripts/validate_config.py", ".github/workflows/config-validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.x"
      - run: python scripts/validate_config.py config.toml
